name: 'Build'

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x, 23.x]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Use node@${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Build
        env:
          ZIPLINE_BUILD: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build